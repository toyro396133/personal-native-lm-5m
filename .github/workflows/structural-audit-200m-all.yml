name: Structural audit 200M all variants

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/structural-audit-200m-all.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile eval_self_core_structural_audit.py
          python -m py_compile compare_self_core_structural_audit.py

  audit:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - variant: baseline
            artifact: v18-baseline-200m
            checkpoint: v18-baseline-200m.pt
          - variant: self_v1
            artifact: v18-self_v1-200m
            checkpoint: v18-self_v1-200m.pt
          - variant: self_v1_slow
            artifact: v18-self_v1_slow-200m
            checkpoint: v18-self_v1_slow-200m.pt
          - variant: diff_only
            artifact: v18-diff_only-200m
            checkpoint: v18-diff_only-200m.pt
          - variant: diff_anchor
            artifact: v18-diff_anchor-200m
            checkpoint: v18-diff_anchor-200m.pt
          - variant: projected_diff
            artifact: v18-projected_diff-200m
            checkpoint: v18-projected_diff-200m.pt
          - variant: projected_diff_slow
            artifact: v18-projected_diff_slow-200m
            checkpoint: v18-projected_diff_slow-200m.pt

    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install assay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece
      - name: Download tokenizer
        uses: actions/download-artifact@v4
        with:
          name: v17-common
          path: common
          github-token: ${{ github.token }}
          run-id: 37572458350
      - name: Download 200M checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: checkpoint
          github-token: ${{ github.token }}
          run-id: 37678419157
      - name: Run structural and causal-proxy audit
        shell: bash
        run: |
          mkdir -p result
          python -u eval_self_core_structural_audit.py \
            "checkpoint/${{ matrix.checkpoint }}" \
            --tokenizer common/tokenizer.model \
            --out "result/${{ matrix.variant }}-200m-structural-audit.json" \
            | tee "result/${{ matrix.variant }}-200m-structural-audit.log"
      - name: Upload audit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-audit-200m-${{ matrix.variant }}
          path: result/
          if-no-files-found: warn
          retention-days: 30

  compare:
    needs: audit
    if: always() && needs.audit.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download all structural audit results
        uses: actions/download-artifact@v4
        with:
          pattern: structural-audit-200m-*
          path: collected
          merge-multiple: false
      - name: Build multi-axis comparison
        run: |
          mkdir -p final
          python compare_self_core_structural_audit.py \
            --root collected \
            --out final/structural-audit-200m-comparison.json
      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: structural-audit-200m-comparison
          path: final/
          retention-days: 30
