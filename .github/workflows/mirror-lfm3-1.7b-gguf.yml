name: Mirror LiquidAI LFM3-1.7B Q4_K_M as resumable 200 MB parts

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-lfm3-1.7b-gguf.yml'

permissions:
  contents: write

concurrency:
  group: mirror-lfm3-1.7b-q4km
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      HF_XET_CHUNK_CACHE_SIZE_BYTES: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Hugging Face metadata and HTTP range clients
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2' requests
      - name: Stream, verify and publish the original GGUF in 200 MB parts
        run: python scripts/mirror_lfm3_1_7b_q4km_ranges.py
