name: V5 Hebrew hand-authored transfer audit

on:
  push:
    branches: [main]
    paths: [.github/workflows/chacham-lev-v5-transfer-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check source read permission
        env:
          SOURCE_TOKEN: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Private Chacham Lev source read token missing."
            exit 1
          fi
      - name: Checkout private research source only
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: feature/tiny-chatbot-v4-cpu
          token: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
          path: source
          sparse-checkout: tiny-chatbot/v4
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'sentencepiece>=0.2,<0.3'
      - name: Validate independent Hebrew test cases and code
        working-directory: source/tiny-chatbot/v4
        run: python -m unittest discover -s conversation_v5/tests -v
      - name: Get existing private checkpoints (read-only)
        env:
          GH_TOKEN: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
        run: |
          for pair in "tinychat-v5-cpu-run-38193615023-1:before" "tinychat-v5-multiturn-38194877912-1:after"; do
            tag="${pair%%:*}"
            folder="${pair##*:}"
            mkdir -p "$RUNNER_TEMP/$folder"
            gh release download "$tag" --repo toyro396133/chacham-lev --dir "$RUNNER_TEMP/$folder" --pattern checkpoint.pt --pattern config.json --pattern subwords.model
            for f in checkpoint.pt config.json subwords.model; do test -s "$RUNNER_TEMP/$folder/$f"; done
          done
      - name: Compare 28 entirely hand-authored Hebrew conversations
        working-directory: source/tiny-chatbot/v4
        run: |
          python conversation_v5/evaluate_manual_transfer.py --model-dir "$RUNNER_TEMP/before" --output "$RUNNER_TEMP/before.json" --max-new-tokens 56 --threads 4
          python conversation_v5/evaluate_manual_transfer.py --model-dir "$RUNNER_TEMP/after" --output "$RUNNER_TEMP/after.json" --max-new-tokens 56 --threads 4
      - name: Report only aggregate correctness, never publish model or raw messages
        run: |
          python - <<'PY'
          import os,json
          root=os.environ['RUNNER_TEMP']
          a=json.load(open(root+'/before.json'))['summary']
          b=json.load(open(root+'/after.json'))['summary']
          assert a['total']==b['total']==28
          report={'before':a,'after':b}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as out:
              out.write('## V5 hand-written transfer benchmark\n')
              out.write('28 unique synthetic-but-manually-authored dialogue cases that were not generated from the training templates. This is a small conservative exact-match benchmark, not validated semantic accuracy.\n\n')
              out.write('Exact: '+str(a['exact'])+'/28 before vs '+str(b['exact'])+'/28 after.\n\n')
              for k in b['by_family']:
                  out.write(k+': '+str(a['by_family'][k]['exact'])+' -> '+str(b['by_family'][k]['exact'])+' / '+str(b['by_family'][k]['count'])+'\n\n')
              out.write('Output nonempty: '+str(a['nonempty'])+' -> '+str(b['nonempty'])+'.\n')
          PY
