name: COMPASS V8.6 Evidence Revocation and Policy Change
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compass-v86-cold-pilot.yml']
  workflow_dispatch:
jobs:
  preflight:
    name: Audit cold source-validity and same-project personal-policy probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v8-6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile all new V8.6 code
        run: |
          python -m py_compile experiments/compass_v8_6/*.py
      - name: Validate all authored source-state and owner-policy reversals
        env:
          PYTHONPATH: experiments/compass_v8_6:experiments/compass_v8_5:experiments/compass_v8_4:experiments/compass_v8_2
        run: |
          python experiments/compass_v8_6/validate_v86.py | tee v86-preflight.json
          python - <<'PY'
          from fixtures_v86 import build,NEW_TEST_ONLY
          from validate_v86 import audit
          r=audit();assert r['status']=='PASS'
          assert r['policy_only_pairs']==16
          assert r['unseen_test_cases']==32
          print('V8.6 cold-family and owner-only-change audit PASS')
          PY
      - name: Save independently auditable fixture preflight
        uses: actions/upload-artifact@v4
        with:
          name: compass-v86-preflight
          path: v86-preflight.json
          if-no-files-found: error
          retention-days: 30
  frozen_features:
    name: Reuse V8.5 360M embeddings and compute only new fictional contexts
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v8-6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download frozen 360M embeddings from verified V8.5 run
        uses: actions/download-artifact@v4
        with:
          name: compass-v85-frozen-embeddings
          run-id: 38108048987
          github-token: ${{ github.token }}
          path: .
      - name: CPU model dependencies for ONLY new input encodings
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4'
      - name: Extend shared cache (no oracle labels in LM forward pass)
        env:
          PYTHONPATH: experiments/compass_v8_6:experiments/compass_v8_5:experiments/compass_v8_4:experiments/compass_v8_2:experiments/personal_smollm2
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/compass_v8_6/cache_v86.py --reuse v85-embeddings.pt --output v86-embeddings.pt
      - name: Preserve shared V8.6 features and fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: compass-v86-shared-embeddings
          path: |
            v86-embeddings.pt
            v86-embeddings.json
          if-no-files-found: error
          retention-days: 30
  rank4_pilot:
    name: Rank4 source-validity raw model and same-project policy counterfactual
    needs: frozen_features
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v8-6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download shared frozen features without rerunning the backbone
        uses: actions/download-artifact@v4
        with:
          name: compass-v86-shared-embeddings
          path: .
      - name: Install CPU-only personal head runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4'
      - name: Train 7,680 PERSONAL weights and test truly withheld families
        env:
          PYTHONPATH: experiments/compass_v8_6:experiments/compass_v8_5:experiments/compass_v8_4:experiments/compass_v8_2:experiments/personal_smollm2
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: |
          python experiments/compass_v8_6/pilot_v86.py --rank 4 --seed 11 --epochs 14 --features v86-embeddings.pt --output compass-v86-r4-s11.json
      - name: Preserve complete raw predictions and personal head checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-v86-r4-s11
          path: |
            compass-v86-r4-s11.json
            compass-v86-r4-s11.safetensors
          if-no-files-found: warn
          retention-days: 30
      - name: Surface policy flips and unseen validity failures
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          a=json.load(open("compass-v86-r4-s11.json"))
          r=a['scores']['head_raw'];c=r['contrast']
          print('## COMPASS V8.6 raw learned performance')
          print(f"Raw model: {r['correct']}/{r['total']}; fact-flip pairs {c['correct_fact_flip_pairs']}/{c['fact_flip_pairs']}; full quartets {c['all_four_correct']}/{c['quadruples']}")
          print(f"Frozen baseline: {a['scores']['frozen']['correct']}/{a['scores']['frozen']['total']}")
          print('### Previously unseen source validity families')
          for name,v in a['cold_families'].items():
              print(f"- {name}: {v['correct']}/{v['total']} (valid {v['valid_correct']}/{v['valid_total']}; invalid {v['invalid_correct']}/{v['invalid_total']})")
          p=a['policy_contrasts']['overall']
          print(f"Policy-only both-correct: {p['both_correct']}/{p['total']}; preference switch: {p['preferred_action_flipped']}/{p['total']}")
          print(f"External owner+source gate (NOT neural learning): {a['scores']['head_source_guarded']['correct']}/{r['total']}")
          PY
