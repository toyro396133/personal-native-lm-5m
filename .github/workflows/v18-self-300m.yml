name: v0.18 SELF 100M to 300M fresh continuation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v18-self-300m.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    env:
      HF_HUB_DISABLE_XET: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install data preparation dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece datasets
      - name: Recover exact v0.17 tokenizer and validation set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p old bundle/common bundle/shards
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11460882774/zip > /tmp/v17-common.zip
          unzip -q /tmp/v17-common.zip -d old
          cp old/tokenizer.model bundle/common/tokenizer.model
          cp old/val.txt bundle/common/val.txt
          cat old/data_report.json
          python - <<'PY'
          import json
          x=json.load(open("old/data_report.json"))
          assert x["documents_seen"] == 125041, x["documents_seen"]
          assert x["seed"] == 217
          assert x["shuffle_buffer"] == 10000
          print("verified v0.17 continuation point:", x["documents_seen"], "documents")
          PY
      - name: Build 20 fresh disjoint continuation shards
        run: |
          set -euo pipefail
          python -u prepare_v18_fineweb_continuation.py \
            --tokenizer bundle/common/tokenizer.model \
            --dataset HuggingFaceFW/fineweb-2 \
            --config heb_Hebr \
            --skip-documents 125041 \
            --shards 20 \
            --tokens-per-shard 10200000 \
            --seed 217 \
            --shuffle-buffer 10000 \
            --val-per-mille 10 \
            --out-dir data/v18 \
            --report bundle/common/data_report_v18.json
          cp data/v18/train-shard-*.i32 bundle/shards/
          ls -lh bundle/common bundle/shards
      - name: Upload common continuation inputs
        uses: actions/upload-artifact@v4
        with:
          name: v18-common
          path: bundle/common/
          compression-level: 3
          retention-days: 30
      - name: Upload fresh shard 01
        uses: actions/upload-artifact@v4
        with:
          name: v18-shard-01
          path: bundle/shards/train-shard-01.i32
          compression-level: 1
          retention-days: 30
      - name: Upload fresh shard 02
        uses: actions/upload-artifact@v4
        with:
          name: v18-shard-02
          path: bundle/shards/train-shard-02.i32
          compression-level: 1
          retention-days: 30
      - name: Upload fresh shard 03
        uses: actions/upload-artifact@v4
        with:
          name: v18-shard-03
          path: bundle/shards/train-shard-03.i32
          compression-level: 1
          retention-days: 30
      - name: Upload fresh shard 04
        uses: actions/upload-artifact@v4
        with:
          name: v18-shard-04
          path: bundle/shards/train-shard-04.i32
          compression-level: 1
          retention-days: 30
      - name: Upload fresh shard 05
        uses: actions/upload-artifact@v4
        with:
          name: v18-shard-05
          path: bundle/shards/train-shard-05.i32
          compression-level: 1
          retention-days: 30
      - name: Upload fresh shard 06
