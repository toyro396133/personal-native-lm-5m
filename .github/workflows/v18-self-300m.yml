          path: bundle/shards/train-shard-08.i32
          compression-level: 1
          retention-days: 30
      - name: Upload fresh shard 09
        uses: actions/upload-artifact@v4
        with:
          name: v18-shard-09
          path: bundle/shards/train-shard-09.i32
          compression-level: 1
