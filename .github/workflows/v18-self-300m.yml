    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, self_v1, self_v1_slow, diff_only, diff_anchor, projected_diff, projected_diff_slow]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece psutil
      - name: Download common inputs
        uses: actions/download-artifact@v4
        with:
          name: v18-common
          path: shared/common
      - name: Download fresh phase 1 shard
        uses: actions/download-artifact@v4
        with:
          name: v18-shard-01
          path: shared/shard
      - name: Download exact v0.17 100M checkpoint
        uses: actions/download-artifact@v4
        with:
          name: v17-${{ matrix.variant }}-100m
          path: resume
          github-token: ${{ github.token }}
          run-id: 37572458350
      - name: Train 100M to 110M with checks every 2M
        shell: bash
        env:
          V: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          bash scripts/run_v17_phase.sh \
            "${V}" \
            "shared/shard/train-shard-01.i32" \
            "shared/common/tokenizer.model" \
            "shared/common/val.txt" \
            "102,104,106,108,110" \
            "40000" \
            "110" \
            "resume/v17-${V}-100m.pt" \
            "v18"
      - name: Upload 110M checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v18-${{ matrix.variant }}-110m
          path: work/${{ matrix.variant }}/v18-${{ matrix.variant }}-110m.pt
