name: COMPASS V12 Real 360M with Historical V9.0 Bridge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compass-v12-v90-bridge.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-trained-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v12-detachable-personal-layer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch preserved V9.0 trained SHARED adapter (synthetic historical research)
        uses: actions/download-artifact@v4
        with:
          name: compass-v90-personal-neural-results
          repository: toyro396133/personal-native-lm-5m
          run-id: '38116261352'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: historical-v90
      - name: Validate real historical trained checkpoint
        run: |
          test -s historical-v90/compass-v90-personal-neural.safetensors
          ls -lh historical-v90/compass-v90-personal-neural.safetensors
      - name: Install existing CPU language-model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.3,<3'
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4' 'sentencepiece'
      - name: Real frozen 360M with ACTUALLY TRAINED V9.0 bridge + V12 continually learned project state
        env:
          PYTHONPATH: experiments/compass_v12
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python experiments/compass_v12/smoke_360m_optional.py \
            --v90-checkpoint historical-v90/compass-v90-personal-neural.safetensors \
            --report compass-v12-v90-bridge-smoke.json \
            --state compass-v12-SYNTHETIC-from-v90-state.json \
            --steps 10 --lr 0.4 --rank 16 --gain 1.0
      - name: Archive only fictional research data, NOT private user memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-v12-historical-trained-bridge-360m
          path: |
            compass-v12-v90-bridge-smoke.json
            compass-v12-SYNTHETIC-from-v90-state.json
          retention-days: 30
          if-no-files-found: warn
      - name: Scientific status
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          r=json.load(open('compass-v12-v90-bridge-smoke.json'))
          print('Bridge:',r['adapter_initialization'])
          print('Frozen base model:',r['model'])
          print('Latent changed:',r['state_update']['state_delta_l2'])
          print('Before:',r['before_yes_no_margins'])
          print('After:',r['after_yes_no_margins'])
          print('Actual user intent/policy learning NOT proven. Historical bridge learned on fictional policy choices.')
          PY
