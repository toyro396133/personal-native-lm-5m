name: v0.13 FineWeb2-native tokenizer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v13-fineweb2-tokenizer.yml'
      - 'prepare_v13_tokenizer_corpus.py'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece pytest datasets

      - name: Download external validation sources
        run: |
          mkdir -p data/knesset artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/NLPH/SVLM-Hebrew-Wikipedia-Corpus/master/SVLM_Hebrew_Wikipedia_Corpus.txt \
            -o data/wiki-old-50k.txt
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/NLPH/knesset-2004-2005/master/kneset.tar.gz \
            -o data/knesset.tar.gz
          tar -xzf data/knesset.tar.gz -C data/knesset
          python prepare_v07_corpus.py \
            --wiki data/wiki-old-50k.txt --knesset-root data/knesset \
            --wiki-cap 32000 --knesset-cap 110000 \
            --train-out data/external-reference-train.txt --val-out data/external-val.txt \
            --report artifacts/v13_external_validation_report.json

      - name: Stream train-only FineWeb2 text for tokenizer
        run: |
          python prepare_v13_tokenizer_corpus.py \
            --dataset HuggingFaceFW/fineweb-2 --config heb_Hebr \
            --chars 8000000 \
            --out data/v13-tokenizer-train.txt \
            --report artifacts/v13_tokenizer_corpus_report.json

      - name: Train FineWeb2-native Unicode-safe Unigram 4K
        run: |
          python train_sentencepiece_tokenizer.py data/v13-tokenizer-train.txt \
            --vocab-size 4096 --model-type unigram \
            --out artifacts/hebrew-v13-fineweb2-unigram-4096.model
          python tokenizer_audit.py artifacts/hebrew-v13-fineweb2-unigram-4096.model data/v13-tokenizer-train.txt \
            --sample-chars 500000 --out artifacts/v13_tokenizer_audit_train.json

      - name: Stream exact FineWeb2 token budgets with native tokenizer
        run: |
          python prepare_v12_fineweb2.py \
            --tokenizer artifacts/hebrew-v13-fineweb2-unigram-4096.model \
            --dataset HuggingFaceFW/fineweb-2 --config heb_Hebr \
            --train-tokens 10000000 --val-tokens 500000 \
            --train-out data/v13-fineweb2-train.txt \
            --val-out data/v13-fineweb2-val.txt \
            --report artifacts/v13_fineweb2_report.json
          python tokenizer_audit.py artifacts/hebrew-v13-fineweb2-unigram-4096.model data/v13-fineweb2-train.txt \
            --sample-chars 500000 --out artifacts/v13_tokenizer_audit_corpus.json

      - name: Train same 5M model for same step budget
        shell: bash
        run: |
          set -o pipefail
          python train_hebrew.py data/v13-fineweb2-train.txt \
            --tokenizer artifacts/hebrew-v13-fineweb2-unigram-4096.model \
            --seq-len 128 --batch-size 12 --epochs 2 --max-steps 6385 \
            --lr 0.00028 --seed 71 --save artifacts/hebrew-fineweb2-v0.13.pt \
            | tee artifacts/v13_train.log

      - name: Evaluate held-out, external and real outputs
        run: |
          python eval_char_normalized.py artifacts/hebrew-fineweb2-v0.13.pt artifacts/hebrew-v13-fineweb2-unigram-4096.model data/v13-fineweb2-val.txt \
            --chars 300000 --out artifacts/v13_fineweb2_char.json
          python eval_char_normalized.py artifacts/hebrew-fineweb2-v0.13.pt artifacts/hebrew-v13-fineweb2-unigram-4096.model data/external-val.txt \
            --chars 300000 --out artifacts/v13_external_char.json
          python demo_inference.py artifacts/hebrew-fineweb2-v0.13.pt \
            --tokenizer artifacts/hebrew-v13-fineweb2-unigram-4096.model --out artifacts/v13_demo_language.json

      - name: Protected personal integration
        shell: bash
        run: |
          set -o pipefail
          python train_longitudinal_v06.py \
            --base artifacts/hebrew-fineweb2-v0.13.pt \
            --tokenizer artifacts/hebrew-v13-fineweb2-unigram-4096.model \
            --personal-warmup 220 --joint-steps 250 --adapt-steps 60 --lr 0.0008 \
            --save artifacts/personal-fineweb2-v0.13.pt | tee artifacts/v13_personal.log

      - name: Evaluate final model
        run: |
          python eval_char_normalized.py artifacts/personal-fineweb2-v0.13.pt artifacts/hebrew-v13-fineweb2-unigram-4096.model data/v13-fineweb2-val.txt \
            --chars 300000 --out artifacts/v13_fineweb2_char_after_personal.json
          python eval_char_normalized.py artifacts/personal-fineweb2-v0.13.pt artifacts/hebrew-v13-fineweb2-unigram-4096.model data/external-val.txt \
            --chars 300000 --out artifacts/v13_external_char_after_personal.json
          python demo_inference.py artifacts/personal-fineweb2-v0.13.pt \
            --tokenizer artifacts/hebrew-v13-fineweb2-unigram-4096.model --out artifacts/v13_demo_final.json

      - name: Build v0.13 A-B report
        run: |
          python - <<'PY'
          import json,re,pathlib
          v8={'nats_per_char':1.4300987180582683,'bits_per_char':2.0631963285243278}
          v12_fine={'nats_per_char':1.7444806029256186,'bits_per_char':2.516753514767779}
          v12_ext={'nats_per_char':1.7913667600504557,'bits_per_char':2.5843959411381223}
          data=json.load(open('artifacts/v13_fineweb2_report.json'))
          ta=json.load(open('artifacts/v13_tokenizer_audit_corpus.json'))
          fine=json.load(open('artifacts/v13_fineweb2_char.json'))
          ext=json.load(open('artifacts/v13_external_char.json'))
          fine_after=json.load(open('artifacts/v13_fineweb2_char_after_personal.json'))
          ext_after=json.load(open('artifacts/v13_external_char_after_personal.json'))
          demo=json.load(open('artifacts/v13_demo_final.json'))
          log=pathlib.Path('artifacts/v13_personal.log').read_text()
          m=re.findall(r'v06_personal_eval_after=([0-9.]+)',log)
          f=re.findall(r'long-freeze-lm-unchanged=(True|False) success=(True|False)',log)
          g=re.findall(r'v06_language_backbone_unchanged=(True|False)',log)
          report={
            'version':'0.13',
            'experiment':'FineWeb2-native tokenizer A/B against v0.12; same vocab size, 5M architecture, data target and 6385-step budget',
            'data':data,
            'tokenizer_audit':ta,
            'v12_fineweb2_reference':v12_fine,
            'v12_external_reference':v12_ext,
            'v8_external_reference':v8,
            'v13_fineweb2':fine,
            'v13_external':ext,
            'fineweb2_relative_nats_change_vs_v12':fine['nats_per_char']/v12_fine['nats_per_char']-1.0,
            'external_relative_nats_change_vs_v12':ext['nats_per_char']/v12_ext['nats_per_char']-1.0,
            'external_relative_nats_change_vs_v8':ext['nats_per_char']/v8['nats_per_char']-1.0,
            'fineweb2_language_delta_after_personal':fine_after['nats_per_char']-fine['nats_per_char'],
            'external_language_delta_after_personal':ext_after['nats_per_char']-ext['nats_per_char'],
            'longitudinal_accuracy':float(m[-1]) if m else None,
            'language_backbone_unchanged':g[-1]=='True' if g else None,
            'freeze_lm_unchanged':f[-1][0]=='True' if f else None,
            'freeze_personal_success':f[-1][1]=='True' if f else None,
            'replacement_chars':demo['replacement_chars_total'],
            'language_examples':demo['language_examples'],
          }
          pathlib.Path('artifacts/v13_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Tests
        run: pytest -q

      - name: Upload v0.13
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-native-lm-v0.13
          path: artifacts/
          retention-days: 30
