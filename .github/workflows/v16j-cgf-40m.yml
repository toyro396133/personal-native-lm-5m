          unzip -q /tmp/v16j-common.zip -d /tmp/v16j-common
          S1=$(find /tmp/v16j-s1 -type f -name '*.i32' | head -1)
          S2=$(find /tmp/v16j-s2 -type f -name '*.i32' | head -1)
