          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11461222157/zip > /tmp/v16j-s1.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11461157267/zip > /tmp/v16j-s2.zip
