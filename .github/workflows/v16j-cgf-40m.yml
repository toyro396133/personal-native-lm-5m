          path: |
            out/checkpoint.pt
            out/report.json
            out/train.log
            out/language-eval.json
            out/language-eval.log
          retention-days: 30

  compare:
    needs: phase5
    if: always() && needs.phase5.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download final arms
        uses: actions/download-artifact@v4
        with:
          pattern: v16j-*-p5
          path: results
          merge-multiple: false

      - name: Build 40M comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          arms = {}
          expected_marks = list(range(4_000_000, 40_000_001, 4_000_000))
          for d in sorted(Path("results").glob("v16j-*-p5")):
              root = d.name.split("-")[1]
              report = json.loads((d / "report.json").read_text(encoding="utf-8"))
              language = json.loads((d / "language-eval.json").read_text(encoding="utf-8"))
              marks = [m["scheduled_token_mark"] for m in report["milestones"]]
              if marks != expected_marks:
                  raise SystemExit(f"{root}: milestone mismatch {marks}")
              latest = report["latest_milestone"]
              arms[root] = {
                  "initial_model_sha256": report["initial_model_sha256"],
                  "tokens_seen": report["tokens_seen"],
                  "normal": latest["normal"],
                  "causal_delta_state_exact": latest["causal_delta_state_exact"],
                  "language_nats_per_char": language["validation"]["nats_per_char"],
                  "language_bits_per_char": language["validation"]["bits_per_char"],
                  "milestones": report["milestones"],
              }

          if set(arms) != {"self", "sham"}:
              raise SystemExit(f"missing arms: {set(arms)}")
          if arms["self"]["initial_model_sha256"] != arms["sham"]["initial_model_sha256"]:
              raise SystemExit("SELF/sham initialization mismatch")

          s = arms["self"]["normal"]
          h = arms["sham"]["normal"]
          comparison = {
              "state_exact_self_minus_sham":
                  s["state_exact_per_step"] - h["state_exact_per_step"],
              "final_exact_self_minus_sham":
                  s["final_state_exact"] - h["final_state_exact"],
              "goal_false_update_self_minus_sham":
                  s["goal_false_update_rate"] - h["goal_false_update_rate"],
              "goal_change_recall_self_minus_sham":
                  s["goal_change_recall"] - h["goal_change_recall"],
              "core_change_recall_self_minus_sham":
                  s["core_change_recall"] - h["core_change_recall"],
              "focus_change_recall_self_minus_sham":
                  s["focus_change_recall"] - h["focus_change_recall"],
              "language_nats_self_minus_sham":
                  arms["self"]["language_nats_per_char"] - arms["sham"]["language_nats_per_char"],
          }

          out = {
              "experiment": "v0.16j independent CORE/GOAL/FOCUS 40M",
              "token_budget": 40_000_000,
              "phases": 5,
              "phase_tokens": 8_000_000,
              "milestone_every": 4_000_000,
              "arms": arms,
              "self_minus_sham": comparison,
              "interpretation_guardrail":
                  "High score alone is insufficient; require selective edge ablation damage and compare SELF root against matched sham root.",
          }
          Path("v16j-comparison.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: v16j-40m-comparison
          path: v16j-comparison.json
          retention-days: 30
