name: v0.16j independent CORE GOAL FOCUS 40M

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16j-cgf-40m.yml'
  workflow_dispatch:

jobs:
  phase1:
    strategy:
      fail-fast: false
      matrix:
        root_mode: [self, sham]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece psutil

      - name: Syntax check
        run: |
          python -m py_compile \
            train_cgf_40m_phase.py \
            train_joint_cgf_15m.py \
            joint_cgf_model.py \
            core_goal_focus_hierarchical_lab.py \
            eval_v17.py \
            model_self_variants.py

      - name: Prepare exact 50M source data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf shared /tmp/v16j-s1 /tmp/v16j-s2 /tmp/v16j-common
          mkdir -p shared /tmp/v16j-s1 /tmp/v16j-s2 /tmp/v16j-common
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11461222157/zip > /tmp/v16j-s1.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11461157267/zip > /tmp/v16j-s2.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11460882774/zip > /tmp/v16j-common.zip
          unzip -q /tmp/v16j-s1.zip -d /tmp/v16j-s1
          unzip -q /tmp/v16j-s2.zip -d /tmp/v16j-s2
          unzip -q /tmp/v16j-common.zip -d /tmp/v16j-common
          S1=$(find /tmp/v16j-s1 -type f -name '*.i32' | head -1)
          S2=$(find /tmp/v16j-s2 -type f -name '*.i32' | head -1)
          TOK=$(find /tmp/v16j-common -type f -name '*.model' | head -1)
          VAL=$(find /tmp/v16j-common -type f -name 'val.txt' | head -1)
          test -n "${S1}" && test -n "${S2}" && test -n "${TOK}" && test -n "${VAL}"
          cat "${S1}" "${S2}" > shared/train-50m.i32
          cp "${TOK}" shared/tokenizer.model
          cp "${VAL}" shared/val.txt
          ls -lh shared
      - name: Train phase 1 to 8M
        run: |
          set -euo pipefail
          rm -rf out
          mkdir -p out
          python -u train_cgf_40m_phase.py \
            --tokens shared/train-50m.i32 \
            --tokenizer shared/tokenizer.model \
            --root-mode "${{ matrix.root_mode }}" \
            --target-tokens 8000000 \
            --milestone-every 4000000 \
            --structure-every 16 \
            --structure-batch 8 \
            --structure-weight 0.18 \
            --seq-len 128 \
            --batch-size 12 \
            --lr 0.00028 \
            --seed 71 \
            --save out/checkpoint.pt \
            --report out/report.json | tee out/train.log

      - name: Upload phase 1
        uses: actions/upload-artifact@v4
        with:
          name: v16j-${{ matrix.root_mode }}-p1
          path: |
            out/checkpoint.pt
            out/report.json
            out/train.log
          retention-days: 30

