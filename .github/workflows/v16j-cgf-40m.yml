            --structure-weight 0.18 \
            --seq-len 128 \
            --batch-size 12 \
            --lr 0.00028 \
            --seed 71 --resume prev/checkpoint.pt \
            --save out/checkpoint.pt \
            --report out/report.json | tee out/train.log

      - name: Upload phase 2
        uses: actions/upload-artifact@v4
        with:
          name: v16j-${{ matrix.root_mode }}-p2
          path: |
