name: Goldfish 124M SELF 100M staged continuation

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage number 10..100; stage 9 is recovered to GitHub Releases'
        required: true
        default: '10'

permissions:
  contents: write
  actions: write

concurrency:
  group: goldfish-self-100m-stage-${{ inputs.stage }}
  cancel-in-progress: false

env:
  RUNTIME_TAG: goldfish-self-100m-runtime
  CHECKPOINT_TAG: goldfish-self-100m-checkpoints

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.stage.outputs.stage }}
      label: ${{ steps.stage.outputs.label }}
      previous: ${{ steps.stage.outputs.previous }}
      save_bf16: ${{ steps.stage.outputs.save_bf16 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate code and resolve stage
        id: stage
        shell: bash
        env:
          STAGE_INPUT: ${{ inputs.stage }}
        run: |
          set -euo pipefail
          python -m py_compile             prepare_goldfish_100m_stage_data.py             train_goldfish_self_stage.py             goldfish_checkpoint_codec.py             eval_goldfish_self_structural_audit.py             compare_goldfish_structural_audit.py
          stage="$STAGE_INPUT"
          if ! [[ "$stage" =~ ^[0-9]+$ ]] || [ "$stage" -lt 10 ] || [ "$stage" -gt 100 ]; then
            echo "stage must be 10..100, got: $stage" >&2
            exit 1
          fi
          previous=$((stage - 1))
          label=$(printf "%03dm" "$stage")
          save_bf16=false
          if [ $((stage % 20)) -eq 0 ] || [ "$stage" -eq 100 ]; then
            save_bf16=true
          fi
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "save_bf16=$save_bf16" >> "$GITHUB_OUTPUT"
      - name: Ensure release stores exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RUNTIME_TAG" >/dev/null 2>&1; then
            gh release edit "$RUNTIME_TAG" --draft
          else
            gh release create "$RUNTIME_TAG" --draft --title "Goldfish SELF 100M runtime" --notes "PRIVATE DRAFT: rolling exact FP32+AdamW states used only to resume the staged Goldfish study."
          fi
          if gh release view "$CHECKPOINT_TAG" >/dev/null 2>&1; then
            gh release edit "$CHECKPOINT_TAG" --draft
          else
            gh release create "$CHECKPOINT_TAG" --draft --title "Goldfish SELF 100M checkpoints" --notes "PRIVATE DRAFT: historical per-stage model checkpoints and structural summaries."
          fi

  prepare:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      STAGE: ${{ needs.init.outputs.stage }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" "huggingface_hub>=0.36" "datasets>=3.2" hf_xet
      - name: Download cumulative used-document hashes from release
        run: |
          gh release download "$RUNTIME_TAG" -p used_doc_hashes.txt -O prior-hashes.txt
          test -s prior-hashes.txt
          echo "prior hashes: $(wc -l < prior-hashes.txt)"
      - name: Prepare fresh non-reused 1M-token stage shard
        run: |
          mkdir -p prepared
          python -u prepare_goldfish_100m_stage_data.py             --stage "$STAGE"             --prior-hashes prior-hashes.txt             --train-tokens 1020000             --out-dir prepared
      - name: Upload stage data
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-100m-data-${{ needs.init.outputs.label }}
          path: prepared/
          compression-level: 1
          retention-days: 3

  train:
    needs: [init, prepare]
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        variant_code: [V1, V2, V3, V4, V5, V6, V7]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
      actions: read
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      STAGE: ${{ needs.init.outputs.stage }}
      LABEL: ${{ needs.init.outputs.label }}
      SAVE_BF16: ${{ needs.init.outputs.save_bf16 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" "huggingface_hub>=0.36" safetensors psutil accelerate hf_xet
      - name: Download stage data
        uses: actions/download-artifact@v4
        with:
          name: goldfish-100m-data-${{ needs.init.outputs.label }}
          path: prepared
      - name: Download fixed validation set from canary #1
        uses: actions/download-artifact@v4
        with:
          name: goldfish-self-common-1m
          path: canary-common
          github-token: ${{ github.token }}
          run-id: 37704611983
      - name: Download exact previous state from GitHub Release
        env:
          V: ${{ matrix.variant_code }}
        run: |
          mkdir -p resume
          gh release download "$RUNTIME_TAG" -p "${V}-latest.pt" -O resume/previous.pt
          python - <<'PY'
          import os, torch
          x=torch.load("resume/previous.pt",map_location="cpu",weights_only=False)
          expected=int(os.environ["STAGE"])-1
          print("resume",x.get("variant_code"),"stage",x.get("stage"))
          assert x.get("variant_code")==os.environ["V"]
          assert int(x.get("stage") or 1)==expected, (x.get("stage"), expected)
          PY
      - name: Train exact full-parameter 1M stage
        env:
          V: ${{ matrix.variant_code }}
        run: |
          mkdir -p work metrics history
          bf16_args=()
          if [ "$SAVE_BF16" = "true" ]; then
            bf16_args=(--save-bf16 "history/${V}-${LABEL}-bf16.pt")
          fi
          python -u train_goldfish_self_stage.py             --variant-code "$V"             --stage "$STAGE"             --resume-state resume/previous.pt             --train prepared/train.i32             --val canary-common/val.i32             --stage-tokens 1000000             --seq-len 128             --save-state "work/${V}-latest.pt"             --save-int4 "history/${V}-${LABEL}-int4.pt"             "${bf16_args[@]}"             --report "metrics/${V}-${LABEL}.json"
      - name: Archive to GitHub Releases, never HF
        env:
          V: ${{ matrix.variant_code }}
        run: |
          set -euo pipefail
          exact_size=$(stat -c%s "work/${V}-latest.pt")
          test "$exact_size" -lt 2000000000 || (echo "Exact state exceeds GitHub 2GB asset limit" && exit 1)
          gh release upload "$RUNTIME_TAG" "work/${V}-latest.pt" --clobber
          gh release upload "$CHECKPOINT_TAG" "history/${V}-${LABEL}-int4.pt"
          if [ "$SAVE_BF16" = "true" ]; then
            gh release upload "$CHECKPOINT_TAG" "history/${V}-${LABEL}-bf16.pt"
          fi
      - name: Upload compact stage metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-100m-metrics-${{ needs.init.outputs.label }}-${{ matrix.variant_code }}
          path: metrics/
          if-no-files-found: warn
          retention-days: 14

  audit:
    needs: [init, train]
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        variant_code: [V1, V2, V3, V4, V5, V6, V7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      LABEL: ${{ needs.init.outputs.label }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" "huggingface_hub>=0.36" sentencepiece accelerate safetensors hf_xet
      - name: Download exact stage state from GitHub Release
        env:
          V: ${{ matrix.variant_code }}
        run: |
          mkdir -p resume
          gh release download "$RUNTIME_TAG" -p "${V}-latest.pt" -O "resume/${V}-latest.pt"
      - name: Run exact stage structural audit
        env:
          V: ${{ matrix.variant_code }}
        run: |
          mkdir -p result
          python -u eval_goldfish_self_structural_audit.py             --variant-code "$V"             --checkpoint-local "resume/${V}-latest.pt"             --audit-label "$LABEL"             --hf-token "$HF_TOKEN"             --out "result/${V}-${LABEL}-structural-audit.json"             | tee "result/${V}-${LABEL}-structural-audit.log"
      - name: Upload structural audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-100m-structural-${{ needs.init.outputs.label }}-${{ matrix.variant_code }}
          path: result/
          if-no-files-found: warn
          retention-days: 30

  compare:
    needs: [init, audit]
    if: ${{ always() && needs.audit.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download all exact structural audits
        uses: actions/download-artifact@v4
        with:
          pattern: goldfish-100m-structural-${{ needs.init.outputs.label }}-*
          path: collected
          merge-multiple: false
      - name: Build stage comparison
        run: |
          mkdir -p final
          python compare_goldfish_structural_audit.py             --root collected             --out "final/goldfish-structural-${{ needs.init.outputs.label }}-comparison.json"
      - name: Upload stage comparison
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-100m-comparison-${{ needs.init.outputs.label }}
          path: final/
          retention-days: 30

  finalize:
    needs: [init, prepare, compare]
    if: ${{ always() && needs.prepare.result == 'success' && needs.compare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ needs.init.outputs.stage }}
      LABEL: ${{ needs.init.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Download stage data metadata
        uses: actions/download-artifact@v4
        with:
          name: goldfish-100m-data-${{ needs.init.outputs.label }}
          path: prepared
      - name: Download stage structural comparison
        uses: actions/download-artifact@v4
        with:
          name: goldfish-100m-comparison-${{ needs.init.outputs.label }}
          path: final
      - name: Persist rolling progress to Releases
        run: |
          cp prepared/used_doc_hashes.txt used_doc_hashes.txt
          cat > current.json <<EOF
          {"schema_version":2,"experiment":"goldfish-124m-self-100m-100-stage","completed_stage":$STAGE,"nominal_total_tokens":$((STAGE*1000000)),"next_stage":$((STAGE<100 ? STAGE+1 : 0)),"storage_backend":"github-releases"}
          EOF
          gh release upload "$RUNTIME_TAG" used_doc_hashes.txt current.json --clobber
          comparison=$(find final -name '*.json' | head -n 1)
          cp "$comparison" "structural-${LABEL}-comparison.json"
          gh release upload "$CHECKPOINT_TAG" "structural-${LABEL}-comparison.json"
      - name: Dispatch next 1M stage
        if: ${{ needs.init.outputs.stage != '100' }}
        run: |
          next=$((STAGE + 1))
          gh workflow run goldfish-self-100m-stage.yml --ref main -f stage="$next"
      - name: Mark 100M complete
        if: ${{ needs.init.outputs.stage == '100' }}
        run: echo "Goldfish seven-arm 100M staged continuation is complete."
