name: DictaLM full SELF collect

on:
  push:
    branches: [main]
    paths:
      - 'experiments/dictalm_self_full/COLLECT.trigger'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN"

      - name: Install Kaggle CLI
        run: python -m pip install -q kaggle

      - name: Check kernel status
        id: status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          KERNEL="${{ github.repository_owner }}/dictalm-self-full-canary"
          kaggle kernels status "$KERNEL" | tee status.txt
          if grep -qi 'complete' status.txt; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if still running
        if: steps.status.outputs.complete != 'true'
        run: |
          echo "Kaggle run is not complete yet."
          exit 1

      - name: Download Kaggle outputs
        if: steps.status.outputs.complete == 'true'
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          mkdir -p kaggle-output
          kaggle kernels output "${{ github.repository_owner }}/dictalm-self-full-canary" -p kaggle-output
          find kaggle-output -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload compact GitHub artifact
        if: steps.status.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dictalm-full-self-canary-results
          path: |
            kaggle-output/dictalm-self-comparison.json
            kaggle-output/results/*.json
            kaggle-output/data/data-report.json
            status.txt
          if-no-files-found: error
          retention-days: 30
