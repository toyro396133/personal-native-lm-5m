name: DictaLM full SELF collect

on:
  push:
    branches: [main]
    paths:
      - 'experiments/dictalm_self_full/COLLECT.trigger'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check Kaggle credentials
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          test -n "$KAGGLE_API_TOKEN"
          test -n "$KAGGLE_USERNAME"

      - name: Install Kaggle CLI
        run: python -m pip install -q kaggle

      - name: Check kernel status
        id: status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          KERNEL="$KAGGLE_USERNAME/dictalm-self-full-canary"
          kaggle kernels status "$KERNEL" | tee status.txt
          if grep -qi 'COMPLETE' status.txt; then
            echo "terminal=true" >> "$GITHUB_OUTPUT"
            echo "success=true" >> "$GITHUB_OUTPUT"
          elif grep -qi 'ERROR' status.txt; then
            echo "terminal=true" >> "$GITHUB_OUTPUT"
            echo "success=false" >> "$GITHUB_OUTPUT"
          else
            echo "terminal=false" >> "$GITHUB_OUTPUT"
            echo "success=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect persisted Kaggle kernel metadata
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -euo pipefail
          rm -rf pulled-kernel
          mkdir -p pulled-kernel
          kaggle kernels pull "$KAGGLE_USERNAME/dictalm-self-full-canary" -p pulled-kernel -m || true
          find pulled-kernel -maxdepth 2 -type f -print
          cat pulled-kernel/kernel-metadata.json 2>/dev/null | tee persisted-kernel-metadata.json || true

      - name: Collect live Kaggle logs
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          set -o pipefail
          kaggle kernels logs "$KAGGLE_USERNAME/dictalm-self-full-canary" 2>&1 | tee live-kaggle.log || true

      - name: Download available Kaggle outputs or diagnostics
        if: steps.status.outputs.terminal == 'true'
        continue-on-error: true
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        run: |
          mkdir -p kaggle-output
          kaggle kernels output "$KAGGLE_USERNAME/dictalm-self-full-canary" -p kaggle-output 2>&1 | tee output-download.txt
          find kaggle-output -maxdepth 4 -type f -printf '%p %s bytes\n' | sort | tee output-files.txt
          for LOG in kaggle-output/*.log; do
            if [[ -f "$LOG" ]]; then
              echo "===== $LOG ====="
              cat "$LOG"
            fi
          done

      - name: Upload Kaggle status and available outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dictalm-full-self-canary-diagnostics
          path: |
            status.txt
            live-kaggle.log
            persisted-kernel-metadata.json
            output-download.txt
            output-files.txt
            kaggle-output/**
          if-no-files-found: warn
          retention-days: 30
