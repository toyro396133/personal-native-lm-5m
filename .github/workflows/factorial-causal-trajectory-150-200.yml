name: Factorial causal trajectory 150M 170M 200M

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/factorial-causal-trajectory-150-200.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check
        run: |
          python -m py_compile eval_self_core_factorial_interaction_300m.py
          python -m py_compile compare_factorial_interaction_trajectory.py

  assay:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - variant: projected_diff
            milestone: 150
            layers: "2"
            artifact: v18-projected_diff-150m
            checkpoint: v18-projected_diff-150m.pt
          - variant: projected_diff
            milestone: 170
            layers: "2"
            artifact: v18-projected_diff-170m
            checkpoint: v18-projected_diff-170m.pt
          - variant: projected_diff
            milestone: 200
            layers: "2"
            artifact: v18-projected_diff-200m
            checkpoint: v18-projected_diff-200m.pt

          - variant: projected_diff_slow
            milestone: 150
            layers: "2"
            artifact: v18-projected_diff_slow-150m
            checkpoint: v18-projected_diff_slow-150m.pt
          - variant: projected_diff_slow
            milestone: 170
            layers: "2"
            artifact: v18-projected_diff_slow-170m
            checkpoint: v18-projected_diff_slow-170m.pt
          - variant: projected_diff_slow
            milestone: 200
            layers: "2"
            artifact: v18-projected_diff_slow-200m
            checkpoint: v18-projected_diff_slow-200m.pt

          - variant: diff_anchor
            milestone: 150
            layers: "3"
            artifact: v18-diff_anchor-150m
            checkpoint: v18-diff_anchor-150m.pt
          - variant: diff_anchor
            milestone: 170
            layers: "3"
            artifact: v18-diff_anchor-170m
            checkpoint: v18-diff_anchor-170m.pt
          - variant: diff_anchor
            milestone: 200
            layers: "3"
            artifact: v18-diff_anchor-200m
            checkpoint: v18-diff_anchor-200m.pt

          - variant: diff_only
            milestone: 150
            layers: "2,3,4"
            artifact: v18-diff_only-150m
            checkpoint: v18-diff_only-150m.pt
          - variant: diff_only
            milestone: 170
            layers: "2,3,4"
            artifact: v18-diff_only-170m
            checkpoint: v18-diff_only-170m.pt
          - variant: diff_only
            milestone: 200
            layers: "2,3,4"
            artifact: v18-diff_only-200m
            checkpoint: v18-diff_only-200m.pt

    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install assay dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece

      - name: Download tokenizer
        uses: actions/download-artifact@v4
        with:
          name: v17-common
          path: common
          github-token: ${{ github.token }}
          run-id: 37572458350

      - name: Download checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: checkpoint
          github-token: ${{ github.token }}
          run-id: 37678419157

      - name: Run exact v4 factorial assay
        run: |
          mkdir -p result
          python -u eval_self_core_factorial_interaction_300m.py             "checkpoint/${{ matrix.checkpoint }}"             --tokenizer common/tokenizer.model             --layers "${{ matrix.layers }}"             --random-shams 8             --out "result/${{ matrix.variant }}-${{ matrix.milestone }}m-factorial.json"             | tee "result/${{ matrix.variant }}-${{ matrix.milestone }}m-factorial.log"

      - name: Upload trajectory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: factorial-trajectory-${{ matrix.variant }}-${{ matrix.milestone }}m
          path: result/
          if-no-files-found: warn
          retention-days: 30

  compare:
    needs: assay
    if: always() && needs.assay.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: factorial-trajectory-*
          path: collected
          merge-multiple: false

      - name: Build causal trajectory comparison
        run: |
          mkdir -p final
          python compare_factorial_interaction_trajectory.py             --root collected             --out final/factorial-causal-trajectory-150-170-200.json

      - name: Upload trajectory comparison
        uses: actions/upload-artifact@v4
        with:
          name: factorial-causal-trajectory-150-170-200
          path: final/
          retention-days: 30
