name: Chacham Lev Tiny Chat V4 CPU

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted branch or SHA in private Chacham Lev repository
        type: string
        required: true
        default: feature/tiny-chatbot-v4-cpu
      steps:
        description: CPU training steps
        type: choice
        required: true
        default: "10"
        options: ["3", "10", "50", "200"]
      batch_size:
        description: CPU batch size
        type: choice
        required: true
        default: "4"
        options: ["1", "2", "4", "8"]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TRAIN_STEPS: ${{ inputs.steps }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      MODEL_DIR: ${{ runner.temp }}/chacham-tiny-model
      SOURCE_REF: ${{ inputs.source_ref }}
    steps:
      - name: Require minimal read-only source token
        env:
          PRIVATE_TOKEN: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Add CHACHAM_LEV_SOURCE_READ_TOKEN (private Chacham Lev contents read-only)."
            exit 1
          fi

      - name: Checkout model source from private Chacham Lev
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: chacham-lev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyTorch CPU wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'sentencepiece>=0.2.0,<0.3'

      - name: Unit tests
        working-directory: chacham-lev/tiny-chatbot/v4
        run: python -m unittest discover -s tests -v

      - name: Train CPU model
        working-directory: chacham-lev/tiny-chatbot/v4
        run: |
          python train_v4.py --data ../dataset.jsonl \
            --steps "$TRAIN_STEPS" --batch-size "$BATCH_SIZE" \
            --threads 4 --output "$MODEL_DIR" --context 1024 --vocab-size 2048

      - name: Validate output files
        run: |
          for file in checkpoint.pt config.json subwords.model metrics.json sample.txt; do
            test -s "$MODEL_DIR/$file" || exit 1
          done
          python -c 'import json,os; m=json.load(open(os.path.join(os.environ["MODEL_DIR"],"metrics.json"))); print("parameters:",m["parameter_count"],"context:",m["context_tokens"],"validation_loss:",m["history"][-1]["validation_loss"])'

      - name: Publish separate GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="chacham-lev-tiny-chat-$GITHUB_RUN_NUMBER"
          gh release create "$tag" \
            "$MODEL_DIR/checkpoint.pt" \
            "$MODEL_DIR/config.json" \
            "$MODEL_DIR/subwords.model" \
            "$MODEL_DIR/metrics.json" \
            "$MODEL_DIR/sample.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Chacham Lev Tiny Chat V4 CPU run $GITHUB_RUN_NUMBER" \
            --notes "Experimental V4 CPU-only 10M Hebrew chatbot with subword tokenizer and 1024-token context; synthetic data. Source reference $SOURCE_REF. Not a validated conversation model."

      - name: Report metrics and examples
        if: always()
        run: |
          echo "## Chacham Lev Tiny Chat V4 CPU" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$MODEL_DIR/metrics.json" ]; then
            echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
            cat "$MODEL_DIR/metrics.json" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$MODEL_DIR/sample.txt" ]; then
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            cat "$MODEL_DIR/sample.txt" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          fi
