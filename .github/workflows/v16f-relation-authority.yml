name: v0.16f relation authority gate lab

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16f-relation-authority.yml'
  workflow_dispatch:

jobs:
  lab:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            mode: direct
            artifact_id: 11462261998

          - variant: self_v1
            mode: direct
            artifact_id: 11460974731
          - variant: self_v1
            mode: relational
            artifact_id: 11460974731

          - variant: self_v1_slow
            mode: direct
            artifact_id: 11462197354
          - variant: self_v1_slow
            mode: relational
            artifact_id: 11462197354

          - variant: diff_only
            mode: direct
            artifact_id: 11462950114
          - variant: diff_only
            mode: relational
            artifact_id: 11462950114

          - variant: diff_anchor
            mode: direct
            artifact_id: 11463155191
          - variant: diff_anchor
            mode: relational
            artifact_id: 11463155191

          - variant: projected_diff
            mode: direct
            artifact_id: 11463095637
          - variant: projected_diff
            mode: relational
            artifact_id: 11463095637

          - variant: projected_diff_slow
            mode: direct
            artifact_id: 11462781724
          - variant: projected_diff_slow
            mode: relational
            artifact_id: 11462781724

    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece psutil

      - name: Syntax check
        run: |
          python -m py_compile             core_goal_focus_authority_lab.py             core_goal_focus_hierarchical_lab.py             core_goal_focus_sequence_lab.py             eval_v17.py             model_self_variants.py

      - name: Download frozen 15M checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p source
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip > /tmp/source.zip
          unzip -q /tmp/source.zip -d source
          CKPT=$(find source -type f -name '*.pt' | head -1)
          test -n "${CKPT}"
          cp "${CKPT}" source/checkpoint.pt

      - name: Recover frozen tokenizer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tokenizer
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11457355518/zip > /tmp/tokenizer.zip
          unzip -q /tmp/tokenizer.zip -d tokenizer
          TOK=$(find tokenizer -type f -name '*.model' | head -1)
          test -n "${TOK}"
          cp "${TOK}" tokenizer/frozen.model

      - name: Run authority-gated hierarchy experiment
        run: |
          set -euo pipefail
          python -u core_goal_focus_authority_lab.py             --checkpoint source/checkpoint.pt             --tokenizer tokenizer/frozen.model             --mode "${{ matrix.mode }}"             --train-sequences 320             --test-sequences 180             --epochs 8             --lr 0.0012             --out result.json             | tee run.log

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: v16f-${{ matrix.variant }}-${{ matrix.mode }}
          path: |
            result.json
            run.log
          retention-days: 30

  compare:
    needs: lab
    if: always() && needs.lab.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: v16f-*
          path: results
          merge-multiple: false

      - name: Compare
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows={}
          for p in Path('results').glob('v16f-*/result.json'):
              d=json.loads(p.read_text(encoding='utf-8'))
              v=d['source_variant']; mode=d['mode']
              a=d['aggregate']
              rows.setdefault(v,{})[mode]={
                  'state_exact_per_step':a['state_exact_per_step']['mean'],
                  'final_state_exact':a['final_state_exact']['mean'],
                  'whole_sequence_exact':a['whole_sequence_exact']['mean'],
                  'mean_steps_to_first_error':a['mean_steps_until_first_error']['mean'],
                  'core_false_update_rate':a['core_false_update_rate']['mean'],
                  'goal_false_update_rate':a['goal_false_update_rate']['mean'],
                  'focus_false_update_rate':a['focus_false_update_rate']['mean'],
                  'core_change_recall':a['core_change_recall']['mean'],
                  'goal_change_recall':a['goal_change_recall']['mean'],
                  'focus_change_recall':a['focus_change_recall']['mean'],
                  'goal_pressure_retention':a['goal_pressure_retention']['mean'],
                  'core_pressure_retention':a['core_pressure_retention']['mean'],
                  'goal_retention_after_3plus_focus_changes':a['goal_retention_after_3plus_focus_changes']['mean'],
                  'causal':d.get('causal',{}),
                  'frozen_unchanged':d['frozen_model_unchanged'],
              }

          expected={'baseline','self_v1','self_v1_slow','diff_only','diff_anchor','projected_diff','projected_diff_slow'}
          if set(rows)!=expected: raise SystemExit(f'missing {expected-set(rows)}')
          if not all(x['frozen_unchanged'] for m in rows.values() for x in m.values()):
              raise SystemExit('frozen source changed')

          out=[]
          for v in sorted(rows):
              r={'variant':v,**rows[v]}
              if 'direct' in r and 'relational' in r:
                  r['relational_minus_direct']=r['relational']['state_exact_per_step']-r['direct']['state_exact_per_step']
              out.append(r)

          report={
              'experiment':'v0.16f relation authority gate lab',
              'rows':out,
              'direct_ranking':sorted(out,key=lambda r:r['direct']['state_exact_per_step'],reverse=True),
              'relational_ranking':sorted([r for r in out if 'relational' in r],key=lambda r:r['relational']['state_exact_per_step'],reverse=True),
              'improvement_ranking':sorted([r for r in out if 'relational_minus_direct' in r],key=lambda r:r['relational_minus_direct'],reverse=True),
          }
          Path('v16f-comparison.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: v16f-comparison
          path: v16f-comparison.json
          retention-days: 30
