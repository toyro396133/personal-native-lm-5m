name: SELF 50 Facts V2 Balanced
on:
  push:
    branches: [main]
    paths: ['.github/workflows/self-50-facts-v2.yml']
  workflow_dispatch:
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/personal-adapter-smollm2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4'
      - name: Balanced stagewise training, isolated personal weights
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          python experiments/personal_smollm2/benchmark_50_v2.py --steps-per-stage 25 --output benchmark-50-v2-results.json
      - name: Save metrics and individual user adapter checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-50-v2-results
          path: |
            benchmark-50-v2-results.json
            personal-v2-stage-*.safetensors
          if-no-files-found: warn
