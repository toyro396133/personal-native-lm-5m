name: SELF V4 Mixed-Chat Multi-Seed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/self-v4-mixed-chat.yml']
  workflow_dispatch:
jobs:
  benchmark:
    name: V4 seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [11, 19, 37]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/personal-adapter-smollm2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python sources compile
        run: |
          python -m py_compile experiments/personal_smollm2/run.py experiments/personal_smollm2/personal_v4_data.py experiments/personal_smollm2/benchmark_v4.py experiments/personal_smollm2/aggregate_v4.py
      - name: Install CPU PyTorch and model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4'
      - name: Verify synthetic profiles, updates and complete replay schedule
        env:
          PYTHONPATH: experiments/personal_smollm2
        run: |
          python - <<'PY'
          from benchmark_v4 import FACTS,state,history,plan_for,rank_memory
          assert len(FACTS) == 24
          assert state(3)[1]["right"] == "35 minutes"
          assert state(4)[1]["right"] == "25 minutes"
          assert state(5)[5]["right"] == "teal"
          for stage in range(1,7):
              facts = state(stage)
              notes = history(stage)
              plan = plan_for(facts,stage,19,32,"replay")
              assert len(plan) == 32
              ids = [r["id"] for r in plan]
              assert all(row["id"] in ids for row in facts)
              assert all(ids.count(row["id"])>=2 for row in facts[-4:])
              rank_memory(facts[0]["test"],notes,3)
          print("Passed static profile/update/rehearsal/retrieval smoke checks.")
          PY
      - name: Train and evaluate across synthetic chat stages
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python experiments/personal_smollm2/benchmark_v4.py --seed ${{ matrix.seed }} --steps-per-stage 32 --topk 3 --output v4-seed-${{ matrix.seed }}.json
      - name: Upload seed measurements and adapter checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-v4-seed-${{ matrix.seed }}
          path: |
            v4-seed-${{ matrix.seed }}.json
            replay-stage-*.safetensors
            recent-stage-*.safetensors
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    name: Aggregate all seed results
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/personal-adapter-smollm2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: self-v4-seed-*
          path: results
          merge-multiple: true
      - name: Make verified three-seed summary
        run: |
          python experiments/personal_smollm2/aggregate_v4.py
          cat v4-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: self-v4-aggregate-results
          path: |
            v4-summary.md
            v4-summary.json
          retention-days: 30
