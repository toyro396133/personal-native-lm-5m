name: Chacham Lev V4 Thinking vs Direct CPU research

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Trusted Chacham Lev model code branch or commit
        type: string
        required: true
        default: feature/tiny-chatbot-v4-cpu
      aya_examples:
        description: Hebrew QA examples for initial language stage
        type: choice
        default: "2000"
        options: ["2000", "5000", "20000"]
      language_steps:
        description: Pretraining steps before Thinking specialization
        type: choice
        default: "200"
        options: ["100", "200", "500"]
      thinking_steps:
        description: CPU Thinking fine-tuning steps
        type: choice
        default: "200"
        options: ["100", "200", "400"]
      reasoning_cases_per_kind:
        description: Synthetic verifiable problem variants per family
        type: choice
        default: "120"
        options: ["80", "120", "240"]

permissions:
  contents: read

jobs:
  controlled-thinking:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DATA_DIR: ${{ runner.temp }}/aya
      BASE_DIR: ${{ runner.temp }}/v4-base
      CASE_DIR: ${{ runner.temp }}/reasoning-cases
      TRAINED_DIR: ${{ runner.temp }}/v4-thinking
      MAX_AYA: ${{ inputs.aya_examples }}
      LANGUAGE_STEPS: ${{ inputs.language_steps }}
      THINKING_STEPS: ${{ inputs.thinking_steps }}
      CASES_PER_KIND: ${{ inputs.reasoning_cases_per_kind }}
    steps:
      - name: Require restricted private source read token
        env:
          PRIVATE_TOKEN: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Configure CHACHAM_LEV_SOURCE_READ_TOKEN (Contents: Read, scoped only to private Chacham Lev repo)."
            exit 1
          fi

      - name: Checkout only V4 experiment from private Chacham Lev repo
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
          persist-credentials: false
          sparse-checkout: tiny-chatbot/v4
          path: source

      - name: Configure Python CPU
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only prerequisites
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'sentencepiece>=0.2.0,<0.3' 'datasets>=3.0,<5.0'

      - name: Run V4 and Thinking contract tests
        working-directory: source/tiny-chatbot/v4
        run: python -m unittest discover -s tests -v

      - name: Prepare screened Hebrew question-answering/dialogue data
        working-directory: source/tiny-chatbot/v4
        run: |
          python prepare_aya.py --qa-only --output "$DATA_DIR" \
            --max-rows "$MAX_AYA" --scan-limit 350000
          python -c 'import json,os; m=json.load(open(os.path.join(os.environ["DATA_DIR"],"aya-manifest.json"))); assert m["train"]>100 and m["validation"]>5, m'

      - name: Stage 1 - Pretrain V4 Hebrew QA without a GPU
        working-directory: source/tiny-chatbot/v4
        run: |
          python train_v4_large.py \
            --train "$DATA_DIR/aya-train.jsonl" \
            --validation "$DATA_DIR/aya-validation.jsonl" \
            --output "$BASE_DIR" \
            --steps "$LANGUAGE_STEPS" --batch-size 8 \
            --threads 4 --context 1024 --vocab-size 2048 \
            --evaluate-every 50 --eval-size 20

      - name: Prepare paired Thinking and direct problems
        working-directory: source/tiny-chatbot/v4
        run: |
          python thinking/thinking_v4.py prepare \
            --output "$CASE_DIR" --per-kind "$CASES_PER_KIND"

      - name: Stage 2 - Specialize same V4 model in both response modes
        working-directory: source/tiny-chatbot/v4
        run: |
          python thinking/train_thinking_v4.py \
            --base-model-dir "$BASE_DIR" \
            --data-dir "$CASE_DIR" \
            --output "$TRAINED_DIR" \
            --steps "$THINKING_STEPS" \
            --batch-size 4 --threads 4 \
            --eval-every 50 --val-examples 18

      - name: Independently test Thinking against direct on identical unseen cases
        working-directory: source/tiny-chatbot/v4
        run: |
          python thinking/thinking_v4.py evaluate \
            --model-dir "$TRAINED_DIR" \
            --test "$CASE_DIR/test.jsonl" \
            --output "$TRAINED_DIR/comparison.json" \
            --limit 30 --thinking-budget 48
          python -c 'import json,os; print(json.load(open(os.path.join(os.environ["TRAINED_DIR"],"comparison.json")))["scores"])'

      - name: Report scores, not internal generated scratchpads
        if: always()
        run: |
          echo "## CPU V4 direct versus Thinking benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "These are small synthetic, shared-template tasks; neither mode is production ready." >> "$GITHUB_STEP_SUMMARY"
          echo "No source files, generated private dialogues, weights, or scratchpads are published." >> "$GITHUB_STEP_SUMMARY"
          for name in "$BASE_DIR/metrics.json" "$TRAINED_DIR/metrics.json"; do
            if [ -f "$name" ]; then
              echo '~~~json' >> "$GITHUB_STEP_SUMMARY"
              cat "$name" >> "$GITHUB_STEP_SUMMARY"
              echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Preserve only non-sensitive experiment summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-thinking-metrics
          path: |
            ${{ runner.temp }}/reasoning-cases/manifest.json
            ${{ runner.temp }}/v4-base/metrics.json
            ${{ runner.temp }}/v4-thinking/metrics.json
          retention-days: 14
          if-no-files-found: warn
