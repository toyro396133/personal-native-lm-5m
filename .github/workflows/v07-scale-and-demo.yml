name: v0.7 scale Hebrew and demos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v07-scale-and-demo.yml'
      - 'prepare_v07_corpus.py'
      - 'demo_inference.py'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest

      - name: Download open Hebrew corpora
        run: |
          mkdir -p data/knesset artifacts
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/NLPH/SVLM-Hebrew-Wikipedia-Corpus/master/SVLM_Hebrew_Wikipedia_Corpus.txt \
            -o data/wiki-50k.txt
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/NLPH/knesset-2004-2005/master/kneset.tar.gz \
            -o data/knesset.tar.gz
          tar -xzf data/knesset.tar.gz -C data/knesset

      - name: Build balanced v0.7 corpus
        run: |
          python prepare_v07_corpus.py \
            --wiki data/wiki-50k.txt \
            --knesset-root data/knesset \
            --wiki-cap 32000 --knesset-cap 110000 \
            --train-out data/v07-train.txt --val-out data/v07-val.txt \
            --report artifacts/v07_corpus_report.json
          wc -l data/v07-*.txt

      - name: Train tokenizer
        run: |
          python train_natural_tokenizer.py data/v07-train.txt \
            --vocab-size 4096 --out artifacts/hebrew-v07-hybrid-4096.json

      - name: Longer natural Hebrew pretraining
        shell: bash
        run: |
          set -o pipefail
          python train_hebrew.py data/v07-train.txt \
            --tokenizer artifacts/hebrew-v07-hybrid-4096.json \
            --seq-len 128 --batch-size 12 --epochs 12 --max-steps 3200 \
            --lr 0.00028 --save artifacts/hebrew-natural-v0.7.pt | tee artifacts/v07_train.log

      - name: Evaluate and demo language
        run: |
          python eval_language.py artifacts/hebrew-natural-v0.7.pt data/v07-val.txt \
            --tokenizer artifacts/hebrew-v07-hybrid-4096.json \
            --seq-len 128 --max-blocks 256 --json-out artifacts/language_before_personal.json
          python demo_inference.py artifacts/hebrew-natural-v0.7.pt \
            --tokenizer artifacts/hebrew-v07-hybrid-4096.json --out artifacts/demo_language.json

      - name: Train protected personal interface
        shell: bash
        run: |
          set -o pipefail
          python train_longitudinal_v06.py \
            --base artifacts/hebrew-natural-v0.7.pt \
            --tokenizer artifacts/hebrew-v07-hybrid-4096.json \
            --personal-warmup 220 --joint-steps 250 --adapt-steps 60 --lr 0.0008 \
            --save artifacts/personal-natural-v0.7.pt | tee artifacts/v07_personal.log

      - name: Evaluate and demo final model
        run: |
          python eval_language.py artifacts/personal-natural-v0.7.pt data/v07-val.txt \
            --tokenizer artifacts/hebrew-v07-hybrid-4096.json \
            --seq-len 128 --max-blocks 256 --json-out artifacts/language_after_personal.json
          python demo_inference.py artifacts/personal-natural-v0.7.pt \
            --tokenizer artifacts/hebrew-v07-hybrid-4096.json --out artifacts/demo_final.json

      - name: Tests
        run: pytest -q

      - name: Build v0.7 report
        run: |
          python - <<'PY'
          import json,re,pathlib
          corpus=json.load(open('artifacts/v07_corpus_report.json'))
          before=json.load(open('artifacts/language_before_personal.json'))
          after=json.load(open('artifacts/language_after_personal.json'))
          demo=json.load(open('artifacts/demo_final.json'))
          log=pathlib.Path('artifacts/v07_personal.log').read_text()
          m=re.findall(r'v06_personal_eval_after=([0-9.]+)',log)
          f=re.findall(r'long-freeze-lm-unchanged=(True|False) success=(True|False)',log)
          g=re.findall(r'v06_language_backbone_unchanged=(True|False)',log)
          report={
            'version':'0.7',
            'corpus':corpus,
            'language_before_personal':before,
            'language_after_personal':after,
            'language_loss_delta':after['loss']-before['loss'],
            'longitudinal_accuracy':float(m[-1]) if m else None,
            'language_backbone_unchanged':g[-1]=='True' if g else None,
            'freeze_lm_unchanged':f[-1][0]=='True' if f else None,
            'freeze_personal_success':f[-1][1]=='True' if f else None,
            'language_examples':demo['language_examples'],
          }
          pathlib.Path('artifacts/v07_report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY

      - name: Upload v0.7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-native-lm-v0.7
          path: artifacts/
          retention-days: 30
