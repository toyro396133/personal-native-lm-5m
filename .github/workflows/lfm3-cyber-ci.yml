name: LFM3-Cyber scaffold checks

on:
  push:
    branches:
      - work/lfm3-cyber-training-infra
      - work/lfm3-cyber-dataset-pilot
    paths:
      - 'projects/lfm3-cyber/**'
      - '.github/workflows/lfm3-cyber-ci.yml'
  pull_request:
    paths:
      - 'projects/lfm3-cyber/**'
      - '.github/workflows/lfm3-cyber-ci.yml'
  workflow_dispatch:
    inputs:
      run_cpu_lora_smoke:
        description: 'Explicitly run the one-step CPU LoRA training smoke test (disabled by default)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lfm3-cyber-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile project scripts
        run: python -m compileall -q projects/lfm3-cyber
      - name: Run dependency-free unit tests
        run: python -m unittest discover -s projects/lfm3-cyber/tests -v
      - name: Validate curated dataset Pilot
        run: python projects/lfm3-cyber/scripts/validate_dataset.py projects/lfm3-cyber/dataset/pilot
      - name: Audit duplicates and split leakage
        run: python projects/lfm3-cyber/scripts/deduplicate_dataset.py projects/lfm3-cyber/dataset/pilot
      - name: Generate dataset audit reports
        run: python projects/lfm3-cyber/scripts/audit_dataset.py projects/lfm3-cyber/dataset/pilot --output-dir projects/lfm3-cyber/dataset/reports
      - name: Audit subskill coverage matrix
        run: python projects/lfm3-cyber/scripts/audit_skill_coverage.py projects/lfm3-cyber/dataset/pilot --output projects/lfm3-cyber/dataset/reports/skill-coverage-report.json
      - name: Verify JSON schemas parse
        run: python -c "import json; json.load(open('projects/lfm3-cyber/schemas/example.schema.json', encoding='utf-8')); json.load(open('projects/lfm3-cyber/dataset/schema.json', encoding='utf-8'))"

  inspect-lfm3-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install model inspection and PEFT dependencies
        run: python -m pip install --no-cache-dir 'transformers>=5.12.1' 'accelerate>=1.10.0' 'peft>=0.20.0'
      - name: Inspect pinned LFM3 architecture without weights
        run: >-
          python projects/lfm3-cyber/scripts/inspect_model.py
          --mode config
          --revision 40ebe0aa6662c9d40389c2f5d565b6a2c6aebacd
          --output projects/lfm3-cyber/reports/module-inventory.json
      - name: Verify LoRA injection on reviewed modules
        run: >-
          python projects/lfm3-cyber/scripts/smoke_test_lora.py
          --inventory projects/lfm3-cyber/reports/module-inventory.json
          --target-modules q_proj,k_proj,v_proj,o_proj,w1,w2,w3
          --revision 40ebe0aa6662c9d40389c2f5d565b6a2c6aebacd
      - name: Upload module inventory
        uses: actions/upload-artifact@v4
        with:
          name: lfm3-cyber-module-inventory
          path: projects/lfm3-cyber/reports/module-inventory.json
          if-no-files-found: error

  cpu-lora-smoke:
    # Explicit opt-in only; dataset PRs must never start training.
    if: github.event_name == 'workflow_dispatch' && inputs.run_cpu_lora_smoke == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Report runner resources
        run: |
          nproc
          free -h
          df -h .
      - name: Install CPU PyTorch
        run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install training dependencies
        run: python -m pip install --no-cache-dir -r projects/lfm3-cyber/requirements.txt
      - name: Prepare synthetic pilot and inspect model architecture
        run: |
          python projects/lfm3-cyber/scripts/validate_dataset.py projects/lfm3-cyber/data/pilot/synthetic.jsonl
          python projects/lfm3-cyber/scripts/prepare_dataset.py projects/lfm3-cyber/data/pilot/synthetic.jsonl --output-dir projects/lfm3-cyber/data/prepared
          python projects/lfm3-cyber/scripts/inspect_model.py --mode config --revision 40ebe0aa6662c9d40389c2f5d565b6a2c6aebacd --output projects/lfm3-cyber/reports/module-inventory.json
      - name: Perform one genuine CPU LoRA optimizer step
        run: |
          python projects/lfm3-cyber/scripts/train_sft.py --train projects/lfm3-cyber/data/prepared/train.jsonl --validation projects/lfm3-cyber/data/prepared/validation.jsonl --inventory projects/lfm3-cyber/reports/module-inventory.json --target-modules q_proj,k_proj,v_proj,o_proj,w1,w2,w3 --device cpu --max-length 128 --max-steps 1 --output-dir projects/lfm3-cyber/model/adapters/lfm3-cyber-cpu-smoke
      - name: Verify adapter output
        run: |
          test -s projects/lfm3-cyber/model/adapters/lfm3-cyber-cpu-smoke/adapter_config.json
          test -s projects/lfm3-cyber/model/adapters/lfm3-cyber-cpu-smoke/adapter_model.safetensors
      - name: Upload trained adapter artifact
        uses: actions/upload-artifact@v4
        with:
          name: lfm3-cyber-cpu-smoke-adapter
          path: projects/lfm3-cyber/model/adapters/lfm3-cyber-cpu-smoke/
          if-no-files-found: error
          retention-days: 14
