name: COMPASS V8 Balanced Rank Comparison
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compass-v8-capacity.yml']
  workflow_dispatch:
jobs:
  preflight:
    name: Verify project splits, class balancing and scorer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and validate fixtures
        run: |
          python -m py_compile experiments/compass_v8/matrix_v8.py experiments/compass_v8/aggregate_capacity_v8.py
          PYTHONPATH=experiments/compass_v8 python experiments/compass_v8/validate_v8.py --root v8-stage0
      - name: Install CPU dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4'
      - name: Test fixed prefix, differing action-token lengths and collapse detection
        env:
          PYTHONPATH: experiments/compass_v8:experiments/personal_smollm2
        run: |
          python - <<'PY'
          import torch
          from collections import Counter
          from matrix_v8 import score_choices, class_balanced_plan, per_class
          from fixtures_v8 import generate,ACTIONS
          d,g=generate()
          labels={v['task_id']:v for v in g['train']}
          plan=class_balanced_plan(d['train'],labels,11,60)
          counts=Counter(labels[t['task']['id']]['action'] for t in plan)
          assert set(counts)==set(ACTIONS) and set(counts.values())=={10}
          class T:
              def apply_chat_template(self,*a,**kw): return [1,2,3,4]
              def encode(self,s,add_special_tokens=False):
                  return {'DO_NOW':[10,11],'SCHEDULE':[12,13,14],
                     'INVESTIGATE':[15,16,17,18],'DEFER':[19],
                     'ASK_USER':[20,21],'REJECT':[22]}[s]
          class M:
              def __call__(self,input_ids):
                  logits=torch.full((1,input_ids.shape[1],100),-4.0)
                  logits[...,19]=8.0
                  return type('R',(),{'logits':logits})()
          chosen,scores=score_choices(T(),M(),"test")
          assert chosen['mean']==chosen['sum']=='DEFER'
          assert scores['SCHEDULE']['tokens']==3
          d=per_class(['DO_NOW','DEFER','INVESTIGATE','REJECT'],['DO_NOW']*4)
          assert d['predicted_unique']==1 and abs(d['balanced_accuracy']-0.25)<1e-6
          print('Balanced training and common-prefix scorer smoke PASS')
          PY
  capacity:
    name: COMPASS rank ${{ matrix.rank }} seed ${{ matrix.seed }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        rank: [4, 16, 64]
        seed: [11, 19, 37]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'safetensors>=0.4'
      - name: Train balanced policy and evaluate all six actions
        env:
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
          PYTHONPATH: experiments/compass_v8:experiments/personal_smollm2
        run: |
          python experiments/compass_v8/matrix_v8.py --rank ${{ matrix.rank }} --seed ${{ matrix.seed }} --steps 60 --out v8-rank${{ matrix.rank }}-seed${{ matrix.seed }}.json
      - name: Archive raw results and weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-v8-rank${{ matrix.rank }}-seed${{ matrix.seed }}
          path: |
            v8-rank${{ matrix.rank }}-seed${{ matrix.seed }}.json
            v8-rank${{ matrix.rank }}-seed${{ matrix.seed }}.safetensors
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    name: Summarize nine capacity runs
    needs: capacity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: compass-v8-rank*-seed*
          path: results
          merge-multiple: true
      - name: Aggregate class-balanced metrics
        run: |
          python experiments/compass_v8/aggregate_capacity_v8.py
          cat v8-capacity-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compass-v8-capacity-summary
          path: |
            v8-capacity-summary.md
            v8-capacity-summary.json
          if-no-files-found: error
          retention-days: 30
