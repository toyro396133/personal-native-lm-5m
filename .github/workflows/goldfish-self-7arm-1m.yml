name: Goldfish 124M SELF seven-arm 1M

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/goldfish-self-7arm-1m.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" "huggingface_hub>=0.36" "datasets>=3.2" hf_xet

      - name: Prepare one matched Hebrew token stream
        run: |
          python -u prepare_goldfish_self_data.py \
            --model goldfish-models/heb_hebr_1000mb \
            --revision 425eee09d1b9ff32ffa21d6cfb300a74302a0799 \
            --train-tokens 1050000 \
            --val-tokens 64000 \
            --seed 1701 \
            --out-dir data/goldfish-self

      - name: Upload matched data
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-self-common-1m
          path: data/goldfish-self/
          compression-level: 1
          retention-days: 7

  train:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant_code: [V1, V2, V3, V4, V5, V6, V7]

    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_XET_HIGH_PERFORMANCE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify Hugging Face archive token
        run: |
          test -n "$HF_TOKEN" || (echo "HF_TOKEN secret is required" && exit 1)

      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=4.48,<5" "huggingface_hub>=0.36" safetensors psutil accelerate hf_xet

      - name: Download matched data
        uses: actions/download-artifact@v4
        with:
          name: goldfish-self-common-1m
          path: shared

      - name: Full-parameter train ${{ matrix.variant_code }}
        shell: bash
        run: |
          mkdir -p work metrics
          python -u train_goldfish_self_arm.py \
            --variant-code '${{ matrix.variant_code }}' \
            --train shared/train.i32 \
            --val shared/val.i32 \
            --target-tokens 1000000 \
            --milestones 250000,500000,1000000 \
            --seq-len 128 \
            --base-lr 1e-5 \
            --adapter-lr 1e-4 \
            --seed 20261008 \
            --data-seed 8841 \
            --rank 8 \
            --projection-rank 4 \
            --save 'work/${{ matrix.variant_code }}-1m-state.pt' \
            --report 'metrics/${{ matrix.variant_code }}.json' \
            --hf-repo personal-native-lm-goldfish-self

      - name: Upload metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-self-metrics-${{ matrix.variant_code }}
          path: metrics/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30

  compare:
    needs: train
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Download completed arm metrics
        uses: actions/download-artifact@v4
        with:
          pattern: goldfish-self-metrics-*
          path: collected
          merge-multiple: false

      - name: Build primitive comparison
        run: |
          mkdir -p final
          python compare_goldfish_self_arms.py \
            --root collected \
            --out final/goldfish_self_7arm_1m_comparison.json

      - name: Upload comparison
        uses: actions/upload-artifact@v4
        with:
          name: goldfish-self-7arm-1m-comparison
          path: final/
          retention-days: 30
