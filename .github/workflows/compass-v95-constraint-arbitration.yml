name: COMPASS V9.5 Independent Constraint Arbitration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/compass-v95-constraint-arbitration.yml']
  workflow_dispatch:
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v9-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate syntax and preregistration
        run: |
          set -euo pipefail
          test -s experiments/compass_v9_5/EXPERIMENT_V9_5.md
          python -m py_compile experiments/compass_v9_5/study_v95.py
          python -m py_compile experiments/compass_v9_4/*.py
          python - <<'PY'
          import ast
          path='experiments/compass_v9_5/study_v95.py'
          tree=ast.parse(open(path,encoding='utf-8').read())
          methods=[n.name for n in ast.walk(tree) if isinstance(n,ast.FunctionDef)]
          assert 'routing_audit' in methods
          assert 'revoked_stress' in methods
          assert 'fresh_cold' in methods
          print('V95 syntax, preregistration, novel task builder and revocation suite PASS')
          PY
  train_and_eval:
    name: Fit separate semantic obligation scorer, then audit 128 new paired cold cases
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/compass-v9-5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen encoder and CPU neural runtime
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install 'transformers>=4.44,<5' 'numpy>=1.24' 'safetensors>=0.4'
      - name: Train only on V9.4 TRAIN and measure V9.5 new synthetic task families
        env:
          PYTHONPATH: experiments/compass_v9_5:experiments/compass_v9_4:experiments/compass_v9_3:experiments/compass_v9_2
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          set -euo pipefail
          python experiments/compass_v9_5/study_v95.py --seed 11 --steps 600 --epochs 45 --policy-epochs 30 --batch 16 --output compass-v95-results.json
      - name: Preserve per-decision results and isolated policy + decision bridge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-v95-independent-policy-results
          path: |
            compass-v95-results.json
            compass-v95-results.safetensors
          if-no-files-found: warn
          retention-days: 30
      - name: Report predeclared gates without hiding NO-GO
        if: success()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('compass-v95-results.json'))
          n=d['fresh_v95_family_cold_not_independently_human_created']
          print('## COMPASS V9.5: '+d['verdict'])
          for k,v in n.items():
              s=v['scores']
              print(f"- {k}: binding {s['binding']['both_correct']}/{s['binding']['n']}, neutral {s['neutral']['both_correct']}/{s['neutral']['n']}")
          print('Detection:',d['detection_audit_fresh'])
          print('Revocation:',d['detection_audit_revoked'])
          print('Gates:',d['registered_gates'])
          print('New tasks and labels are researcher-authored; source authority is not verified; NOT a deployed neural adapter.')
          PY
