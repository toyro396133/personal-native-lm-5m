name: v0.16b SELF variants 15M parallel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v16b-self-15m.yml'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Reuse exact shared token IDs from v0.15c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p shared
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/11457355518/zip > /tmp/v15c-shared.zip
          unzip -q /tmp/v15c-shared.zip -d shared
          test -f shared/data/v15c-token-ids.pt
          test -f shared/data/v15c-val.txt
          test -f shared/artifacts/hebrew-v15c-unigram-4096.model
          find shared -maxdepth 3 -type f -printf '%p %s bytes\n' | sort

      - name: Upload shared inputs once
        uses: actions/upload-artifact@v4
        with:
          name: v16b-shared
          path: shared/
          compression-level: 3
          retention-days: 3

  train:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, self_v1, self_v1_slow, diff_only, diff_anchor, projected_diff, projected_diff_slow]

    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install sentencepiece psutil

      - name: Download identical shared inputs
        uses: actions/download-artifact@v4
        with:
          name: v16b-shared
          path: shared

      - name: Train and evaluate 2M
        shell: bash
        env:
          V: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "work/${V}" "metrics/${V}/2m"
          if [ "${V}" = "baseline" ]; then
            python -u train_v15c_chunk.py \
              --tokens shared/data/v15c-token-ids.pt \
              --tokenizer shared/artifacts/hebrew-v15c-unigram-4096.model \
              --variant baseline --target-tokens 2000000 \
              --seq-len 128 --batch-size 12 --lr 0.00028 --seed 71 \
              --save "work/${V}/v16b-${V}-2m.pt" \
              --report "metrics/${V}/2m/train.json" \
              | tee "metrics/${V}/2m/train.log"
            python -u eval_v15.py "work/${V}/v16b-${V}-2m.pt" \
              --tokenizer shared/artifacts/hebrew-v15c-unigram-4096.model \
              --fineweb-val shared/data/v15c-val.txt \
              --external-val shared/data/v15c-val.txt \
              --chars 50000 \
              --out "metrics/${V}/2m/eval.json"
          else
            python -u train_self_v2_chunk.py \
              --tokens shared/data/v15c-token-ids.pt \
              --tokenizer shared/artifacts/hebrew-v15c-unigram-4096.model \
              --variant "${V}" --target-tokens 2000000 \
              --seq-len 128 --batch-size 12 --lr 0.00028 --seed 71 \
              --save "work/${V}/v16b-${V}-2m.pt" \
              --report "metrics/${V}/2m/train.json" \
              | tee "metrics/${V}/2m/train.log"
            python -u eval_self_v2.py "work/${V}/v16b-${V}-2m.pt" \
              --tokenizer shared/artifacts/hebrew-v15c-unigram-4096.model \
              --fineweb-val shared/data/v15c-val.txt \
              --chars 50000 \
              --out "metrics/${V}/2m/eval.json"
          fi

      - name: Upload 2M checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: v16b-${{ matrix.variant }}-2m
          path: work/${{ matrix.variant }}/v16b-${{ matrix.variant }}-2m.pt
          compression-level: 3
          retention-days: 3

      - name: Upload 2M metrics
        uses: actions/upload-artifact@v4
        with:
          name: v16b-metrics-${{ matrix.variant }}-2m
          path: metrics/${{ matrix.variant }}/2m/
          retention-days: 14

      - name: Train and evaluate 4M
