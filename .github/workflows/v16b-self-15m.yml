              --variant baseline --target-tokens 4000000 --resume "work/${V}/v16b-${V}-2m.pt" \
              --seq-len 128 --batch-size 12 --lr 0.00028 --seed 71 \
              --save "work/${V}/v16b-${V}-4m.pt" \
