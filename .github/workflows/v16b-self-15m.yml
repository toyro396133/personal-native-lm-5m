  compare:
    needs: train
    if: always() && needs.train.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Download metrics only
        uses: actions/download-artifact@v4
        with:
          pattern: v16b-metrics-*
          path: compare
          merge-multiple: false

      - name: Build 15M comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          variants=['baseline','self_v1','self_v1_slow','diff_only','diff_anchor','projected_diff','projected_diff_slow']
          milestones=[2,4,6,8,10,12,14,15]
          points=[]
          base_hashes=set()
          first_losses={}

          for m in milestones:
              row={'million_tokens':m,'variants':{}}
              for v in variants:
                  root=Path('compare')/f'v16b-metrics-{v}-{m}m'
                  tr=json.loads((root/'train.json').read_text())
                  ev=json.loads((root/'eval.json').read_text())
                  base_hashes.add(tr['base_sha256'])
                  first_losses[v]=tr['first_loss']
                  d={
                      'tokens_seen':tr['tokens_seen'],
                      'last_loss':tr['last_loss'],
                      'nats_per_char':ev['fineweb2']['nats_per_char'],
                      'bits_per_char':ev['fineweb2']['bits_per_char'],
                      'parameters':tr['parameters'],
                      'extra_parameters':tr['extra_parameters'],
                      'total_elapsed_seconds':tr['total_elapsed_seconds'],
                  }
                  if v != 'baseline':
                      d['anchor_lr_scale']=tr['anchor_lr_scale']
                      d['anchor_norm']=tr['self_diagnostics']['anchor_norm']
                  row['variants'][v]=d
              points.append(row)

          if len(base_hashes) != 1:
              raise SystemExit(f'base initialization mismatch: {base_hashes}')

          final=points[-1]['variants']
          report={
              'experiment':'v0.16b SELF variants 15M parallel',
              'same_initial_base':True,
              'base_sha256':next(iter(base_hashes)),
              'milestones':milestones,
              'first_losses':first_losses,
              'first_loss_range':max(first_losses.values())-min(first_losses.values()),
              'points':points,
              'ranking_15m':sorted(
                  [
                      {
                          'variant':v,
                          'nats_per_char':d['nats_per_char'],
                          'parameters':d['parameters'],
                          'extra_parameters':d['extra_parameters'],
                          'total_elapsed_seconds':d['total_elapsed_seconds'],
                          **({'anchor_norm':d['anchor_norm']} if 'anchor_norm' in d else {}),
                      }
                      for v,d in final.items()
                  ],
                  key=lambda x:x['nats_per_char']
              )
          }
          Path('v16b-15m-comparison.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY

      - name: Upload final comparison
        uses: actions/upload-artifact@v4
        with:
          name: v16b-15m-comparison
          path: v16b-15m-comparison.json
          retention-days: 30
