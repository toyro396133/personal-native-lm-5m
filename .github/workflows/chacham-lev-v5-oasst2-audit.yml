name: V5 audit real Hebrew OpenAssistant dialogues

on:
  push:
    branches: [main]
    paths: [.github/workflows/chacham-lev-v5-oasst2-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify_dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research-only parser
        uses: actions/checkout@v4
        with:
          repository: toyro396133/chacham-lev
          ref: feature/tiny-chatbot-v4-cpu
          token: ${{ secrets.CHACHAM_LEV_SOURCE_READ_TOKEN }}
          sparse-checkout: tiny-chatbot/v4
          path: source
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public data and model test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1
          python -m pip install 'sentencepiece>=0.2,<0.3' 'datasets>=3,<5' 'huggingface-hub>=0.30'
      - name: Validate audit logic
        working-directory: source/tiny-chatbot/v4
        run: python -m unittest discover -s conversation_v5/tests -v
      - name: Audit reviewed human-authored Hebrew dialogue chains only
        working-directory: source/tiny-chatbot/v4
        run: |
          python conversation_v5/audit_oasst2_hebrew.py --output "$RUNNER_TEMP/hebrew-reviewed-dialogues"
      - name: Publish dataset counts only
        run: |
          python - <<'PY'
          import os,json
          m=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'hebrew-reviewed-dialogues','manifest.json')))
          print(json.dumps(m,ensure_ascii=False,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as o:
              o.write('## Public dataset suitability audit (NO TRAINING)\n\n')
              o.write('Source: OpenAssistant/oasst2, Apache-2.0.\n\n')
              o.write('Tagged Hebrew messages: '+str(m['scanned']['hebrew_tagged'])+'\n\n')
              o.write('Reviewed all-Hebrew >=4-turn assistant paths: '+str(m['valid_multiturn_paths'])+'\n\n')
              o.write('Splits: '+str(m['counts'])+'\n\n')
              o.write('Privacy and manual suitability review still required. No dialogue text or weights are published.\n')
          PY
